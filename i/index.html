<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORZEN GARAGES - Liquid OS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { brand: { light: '#f4f4f5', dark: '#09090b' } }
                }
            }
        }
    </script>
    
    <script>
        // Anti-FOUC
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>

    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        /* Ultra Liquid Glass Class */
        .glass-liquid {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }
        .dark .glass-liquid {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body class="bg-brand-light dark:bg-brand-dark text-black dark:text-white antialiased min-h-screen w-full flex items-center justify-center overflow-hidden relative selection:bg-gray-300 dark:selection:bg-gray-700">

    <!-- Abstract Subtle Background Gradient -->
    <div class="absolute inset-0 z-0 opacity-40 dark:opacity-20 pointer-events-none" style="background: radial-gradient(circle at 50% 50%, #9ca3af 0%, transparent 60%);"></div>

    <main class="relative z-10 w-full max-w-7xl h-[100dvh] md:h-[90vh] p-4 md:p-8 flex flex-col md:flex-row gap-8 items-center justify-center">
        
        <!-- Left Side: Brand & Visuals -->
        <div class="w-full md:w-1/2 h-full flex flex-col justify-between items-center md:items-start pt-4 md:pt-10">
            <!-- Logos -->
            <div class="w-full flex justify-between items-center">
                <img src="1000119505_2.png" alt="STORZEN" class="h-8 md:h-12 object-contain block dark:hidden">
                <img src="1000119497_2.png" alt="STORZEN" class="h-8 md:h-12 object-contain hidden dark:block">
                
                <!-- Monochrome Theme Toggle -->
                <button id="themeToggle" class="md:hidden p-2 rounded-full glass-liquid hover:bg-black/5 dark:hover:bg-white/10 transition">
                    <svg class="w-5 h-5 text-black dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>

            <!-- Hero Text -->
            <div class="mt-8 md:mt-12 text-center md:text-left z-20">
                <h1 class="text-4xl md:text-6xl font-bold tracking-tight leading-tight">
                    Manage.<br>Track.<br>Grow.
                </h1>
                <p class="mt-4 text-sm md:text-lg text-gray-600 dark:text-gray-400 font-light max-w-md">
                    The ultra-premium operating system for modern workshops.
                </p>
            </div>

            <!-- Cars (Fixed overlap issue) -->
            <div class="w-full flex-grow flex items-end justify-center md:justify-start -mb-4 md:-mb-10 z-10">
                <!-- Desktop Cars -->
                <img src="1000119244_2.png" alt="Car" class="w-full max-w-2xl object-contain hidden md:block dark:hidden drop-shadow-2xl">
                <img src="1000119245_2.png" alt="Car" class="w-full max-w-2xl object-contain hidden md:block dark:hidden md:dark:block drop-shadow-[0_20px_40px_rgba(0,0,0,0.8)]">
                <!-- Mobile Cars -->
                <img src="1000119154.png" alt="Car" class="w-[85%] max-w-sm object-contain block dark:hidden md:hidden drop-shadow-xl">
                <img src="1000119156.png" alt="Car" class="w-[85%] max-w-sm object-contain hidden dark:block md:hidden drop-shadow-xl">
            </div>
        </div>

        <!-- Right Side: Liquid Glass Login Box -->
        <div class="w-full md:w-1/2 flex items-center justify-center relative">
            
            <!-- Desktop Theme Toggle -->
            <button id="themeToggleDesktop" class="hidden md:block absolute top-0 right-0 p-3 rounded-full glass-liquid hover:bg-black/5 dark:hover:bg-white/10 transition z-50">
                <!-- Strict monochrome SVG -->
                <svg class="w-5 h-5 text-black dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>

            <!-- Ultra Liquid Form -->
            <div class="w-full max-w-[400px] glass-liquid rounded-[2rem] p-8 md:p-10 z-20">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold">Welcome Back</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Sign in to your workspace</p>
                </div>

                <form id="loginForm" class="space-y-5">
                    <!-- Email -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium pl-2">Email Address</label>
                        <input type="email" id="email" placeholder="owner@garage.com" class="w-full px-4 py-3 bg-white/10 dark:bg-black/20 backdrop-blur-sm border border-black/10 dark:border-white/10 rounded-xl text-black dark:text-white placeholder-gray-400 focus:outline-none focus:border-black/30 dark:focus:border-white/30 transition-all">
                    </div>

                    <!-- Password -->
                    <div class="space-y-2">
                        <label class="text-sm font-medium pl-2">Password</label>
                        <div class="relative">
                            <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-3 bg-white/10 dark:bg-black/20 backdrop-blur-sm border border-black/10 dark:border-white/10 rounded-xl text-black dark:text-white placeholder-gray-400 focus:outline-none focus:border-black/30 dark:focus:border-white/30 transition-all">
                            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-500 hover:text-black dark:hover:text-white">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Utilities -->
                    <div class="flex items-center justify-between px-1">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" class="w-4 h-4 rounded border-gray-300 bg-transparent text-black dark:text-white focus:ring-0">
                            <span class="text-xs text-gray-500 dark:text-gray-400">Remember me</span>
                        </label>
                        <a href="#" id="forgotBtn" class="text-xs font-semibold hover:underline underline-offset-4">Forgot password?</a>
                    </div>

                    <!-- Sign In Btn -->
                    <button type="submit" class="w-full py-3 mt-2 bg-black dark:bg-white text-white dark:text-black font-semibold rounded-xl shadow-lg transition-transform active:scale-95 flex justify-center items-center gap-2">
                        Sign In
                    </button>
                </form>

                <div class="flex items-center my-6">
                    <div class="flex-grow border-t border-black/10 dark:border-white/10"></div>
                    <span class="px-3 text-xs text-gray-500">OR</span>
                    <div class="flex-grow border-t border-black/10 dark:border-white/10"></div>
                </div>

                <button id="googleBtn" class="w-full py-3 bg-white/20 dark:bg-black/20 backdrop-blur-sm border border-black/10 dark:border-white/10 hover:bg-white/30 dark:hover:bg-black/40 text-sm font-semibold rounded-xl transition-all flex items-center justify-center gap-3">
                    <!-- Google G Icon (Monochrome) -->
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="currentColor"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor"/></svg>
                    Continue with Google
                </button>
            </div>
        </div>
    </main>

    <!-- UI Scripts -->
    <script>
        // Password Visibility
        document.getElementById('togglePassword').addEventListener('click', () => {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        });

        // Theme Toggle (Both Mobile & Desktop buttons)
        const toggleTheme = () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        };
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.getElementById('themeToggleDesktop').addEventListener('click', toggleTheme);
    </script>
    
    <!-- Link to Firebase Auth Logic -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
