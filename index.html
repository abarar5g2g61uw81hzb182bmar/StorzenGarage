<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STORZEN GARAGES</title>
    <link rel="stylesheet" href="css/style.css">
    <script>if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-theme');</script>
</head>
<body>
    <div class="ambient-breath"></div>

    <!-- Blur Loader -->
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-weight: 600; letter-spacing: 1px;">INITIALIZING OS...</p>
    </div>

    <!-- Clickable Headlights -->
    <div id="headlightTriggerMobile" class="headlight-zone headlight-mobile"></div>
    <div id="headlightTriggerDesktop" class="headlight-zone headlight-desktop"></div>

    <div class="app-wrapper loading" id="appWrapper">
        <header class="header">
            <div class="logo">
                <img src="1000119505_2.png" id="logoLight" style="display: block;">
                <img src="1000119497_2.png" id="logoDark" style="display: none;">
            </div>
            <button id="themeToggleBtn" class="theme-toggle">
                <svg id="moonIcon" style="width:20px;height:20px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                <svg id="sunIcon" style="width:20px;height:20px; display:none;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>
        </header>

        <main class="main-content">
            <div class="glass-panel" id="tiltCard">
                
                <!-- Login/Signup Toggle -->
                <div class="auth-tabs">
                    <div class="tab-slider" id="tabSlider"></div>
                    <button class="tab-btn active" id="tabLogin">LOGIN</button>
                    <button class="tab-btn" id="tabSignup">SIGNUP</button>
                </div>

                <!-- LOGIN FORM -->
                <form id="signInForm" class="auth-form active">
                    <div class="input-group">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        <input type="email" id="loginEmail" class="glass-input" required placeholder="Email">
                    </div>
                    <div class="input-group">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <input type="password" id="loginPass" class="glass-input" required placeholder="Password">
                    </div>
                    <button type="submit" class="btn-primary">Sign In &rarr;</button>
                </form>

                <!-- SIGNUP FORM -->
                <form id="signUpForm" class="auth-form">
                    <div class="input-group">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <input type="text" id="signupName" class="glass-input" required placeholder="Garage Name">
                    </div>
                    <div class="input-group">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        <input type="email" id="signupEmail" class="glass-input" required placeholder="Email">
                    </div>
                    <div class="input-group">
                        <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <input type="password" id="signupPass" class="glass-input" required placeholder="Create Password">
                    </div>
                    <button type="submit" class="btn-primary">Create Account</button>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
